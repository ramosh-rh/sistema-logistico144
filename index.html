<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística - Gestão de Pausas</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <style>
        /* --- ESTILO BASE --- */
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(-45deg, #050509, #0a0e14, #08121c, #050509); 
            background-size: 400% 400%; 
            animation: gradientShift 15s ease infinite; 
            color: #a2aab3; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            height: 100vh; 
            overflow: hidden; 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0e14; }
        ::-webkit-scrollbar-thumb { background: #00f2fe; border-radius: 3px; }

        /* --- NAVEGAÇÃO --- */
        .nav-bar {
            background: rgba(10, 14, 20, 0.9);
            border-bottom: 2px solid #1f293a;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid #00f2fe;
            color: #00f2fe;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .nav-btn.active {
            background: #00f2fe;
            color: #050509;
        }
        .nav-btn:hover {
            box-shadow: 0 0 10px #00f2fe;
        }

        /* --- VIEWS --- */
        .view {
            display: none;
            flex-grow: 1;
            height: calc(100vh - 60px);
        }
        .view.active {
            display: flex;
        }

        /* --- ADMIN VIEW --- */
        .sidebar { 
            width: 320px; 
            background: rgba(10, 14, 20, 0.85); 
            backdrop-filter: blur(10px); 
            border-right: 2px solid #1f293a; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            box-shadow: 5px 0 20px rgba(0,0,0,0.8); 
        }
        .sidebar h2 { color: #00f2fe; font-size: 1.1em; text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; }
        
        .box-inclusao { display: flex; gap: 5px; margin-bottom: 15px; }
        .box-inclusao input { flex-grow: 1; padding: 10px; border-radius: 6px; border: 1px solid #1f293a; background: #050509; color: #fff; text-transform: uppercase; outline: none; }
        .box-inclusao input:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.4); }
        .box-inclusao button { background: #00f2fe; color: #050509; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; padding: 0 15px; font-size: 1.2em; }
        
        #lista-disponiveis { 
            flex-grow: 1; 
            overflow-y: auto; 
            background: rgba(8, 10, 16, 0.6); 
            border-radius: 8px; 
            padding: 8px; 
            border: 1px solid #1f293a; 
        }
        .funcionario-item { 
            background: #10141d; 
            margin: 6px 0; 
            padding: 12px; 
            border-radius: 6px; 
            cursor: grab; 
            border-left: 3px solid #1f293a; 
            font-size: 0.85em; 
            color: #fff; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .funcionario-item:hover { border-left-color: #00f2fe; background: #161b27; }
        .btn-delete-small {
            background: transparent;
            color: #ff3333;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0 5px;
        }

        /* --- DISPLAY VIEW & SHARED --- */
        .main-content { flex-grow: 1; padding: 25px; display: flex; flex-direction: column; position: relative; overflow-y: auto; }
        .container { flex-grow: 1; display: flex; flex-direction: column; max-width: 1200px; margin: auto; width: 100%; }
        
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(31, 41, 58, 0.5); padding-bottom: 15px; margin-bottom: 20px; }
        #clock { font-size: 3.5em; font-weight: 900; color: #fff; font-family: monospace; text-shadow: 0 0 20px rgba(0, 242, 254, 0.5); }
        .titulo-painel { text-transform: uppercase; letter-spacing: 4px; color: #ff9900; font-weight: 900; font-size: 1.2em; }

        .status-card { 
            background: rgba(10, 14, 20, 0.8); 
            backdrop-filter: blur(5px); 
            border: 1px solid #1f293a; 
            border-radius: 15px; 
            padding: 30px; 
            display: flex; 
            align-items: center; 
            gap: 30px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            position: relative; 
            overflow: hidden; 
            margin-bottom: 20px;
        }
        .status-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #4facfe, #00f2fe); }
        
        .info-grupo { flex-grow: 1; text-align: left; }
        .label-status { font-size: 0.9em; color: #5c6773; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        .nomes-ativos { font-size: 2.2em; color: #fff; font-weight: 900; text-transform: uppercase; margin: 10px 0; min-height: 1.2em; }
        .aviso-saida { font-size: 1.5em; color: #ff3333; font-weight: 900; display: none; text-transform: uppercase; margin-top: 10px; }

        .tempo-container { position: relative; width: 160px; height: 160px; flex-shrink: 0; }
        .circulo-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .circulo-fundo { fill: none; stroke: rgba(31, 41, 58, 0.5); stroke-width: 8; }
        .circulo-progresso { fill: none; stroke: #00f2fe; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 440; stroke-dashoffset: 440; transition: stroke-dashoffset 1s linear; filter: drop-shadow(0 0 10px #00f2fe); }
        .mascote-logistica { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 65px; }

        /* GRID */
        .grid-horarios { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        .slot-horario { background: rgba(10, 14, 20, 0.7); border: 1px solid #1f293a; border-radius: 10px; padding: 15px; min-height: 100px; transition: 0.3s; }
        .slot-horario.active-row { border-color: #00f2fe; background: rgba(13, 26, 36, 0.9); transform: scale(1.03); z-index: 5; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }
        .slot-header { font-size: 1.1em; font-weight: 900; color: #00f2fe; margin-bottom: 10px; border-bottom: 1px solid rgba(31, 41, 58, 0.5); padding-bottom: 8px; }
        .slot-nomes { display: flex; flex-wrap: wrap; gap: 5px; }
        .nome-tag { 
            background: #10141d; 
            padding: 4px 8px; 
            border-radius: 4px; 
            border: 1px solid #1f293a; 
            font-size: 0.8em; 
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-remove-tag {
            background: transparent;
            border: none;
            color: #ff3333;
            cursor: pointer;
            font-weight: bold;
            padding: 0 2px;
        }

        /* ANIMAÇÕES */
        @keyframes pulsar-vermelho { 0% { stroke: #ff3333; } 50% { stroke: #ff0000; filter: drop-shadow(0 0 15px #ff0000); } 100% { stroke: #ff3333; } }
        .tempo-critico .circulo-progresso { animation: pulsar-vermelho 1s infinite; }
        
        /* MODO TV / DISPLAY - ULTRA COMPACTO */
        .view-display .container { max-width: 98vw; height: 98vh; justify-content: flex-start; gap: 10px; padding: 10px; margin: 0 auto; }
        .view-display .dash-header { margin-bottom: 5px; padding-bottom: 5px; }
        .view-display #clock-display { font-size: 2.5em; }
        .view-display .titulo-painel { font-size: 1.2em; }
        
        .view-display .status-card { padding: 15px; margin-bottom: 10px; gap: 15px; }
        .view-display .tempo-container { width: 80px; height: 80px; }
        .view-display .mascote-logistica { font-size: 35px; }
        .view-display .nomes-ativos { font-size: 1.8em; margin: 2px 0; color: #00f2fe; }
        .view-display .label-status { font-size: 0.8em; }
        .view-display .aviso-saida { font-size: 1.1em; margin-top: 5px; }

        .view-display .grid-horarios { grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .view-display .slot-horario { padding: 8px; min-height: 60px; }
        .view-display .slot-header { font-size: 0.9em; margin-bottom: 5px; }
        .view-display .nome-tag { font-size: 0.85em; padding: 3px 8px; }
        .view-display .btn-remove-tag { display: none; }

        /* UTIL */
        .btn-acao { background: #00f2fe; color: #050509; border: none; padding: 12px; border-radius: 6px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 10px; }
        .btn-secundario { background: #10141d; color: #00f2fe; border: 1px solid #1f293a; }
        .drag-over { border-color: #00f2fe !important; background: rgba(0, 242, 254, 0.1) !important; }
    </style>
</head>
<body>

<div class="nav-bar" id="nav-bar">
    <button class="nav-btn active" onclick="switchView('admin')">⚙️ GESTÃO (ADMIN)</button>
    <button class="nav-btn" onclick="switchView('display')">📺 VISUALIZAÇÃO (TV)</button>
</div>

<!-- TELA DE GESTÃO -->
<div id="view-admin" class="view active">
    <div class="sidebar">
        <h2>👥 FUNCIONÁRIOS</h2>
        <div class="box-inclusao">
            <input type="text" id="novoNome" placeholder="NOME DO OPERADOR" autocomplete="off">
            <button onclick="adicionarNomeManual()">+</button>
        </div>
        <input type="file" id="inputExcel" accept=".xlsx, .xls" style="display: none;" onchange="importarExcel(event)">
        <button class="btn-acao btn-secundario" onclick="document.getElementById('inputExcel').click()">📂 IMPORTAR EXCEL</button>
        <button class="btn-acao btn-secundario" style="color: #ff3333; border-color: #ff3333;" onclick="limparTodosNomes()">🗑️ LIMPAR TUDO</button>
        
        <p style="font-size: 0.7em; text-align: center; margin: 10px 0;">Arraste os nomes para os horários</p>
        <div id="lista-disponiveis" ondrop="dropNoPool(event)" ondragover="allowDrop(event)"></div>
    </div>

    <div class="main-content">
        <div class="container">
            <div class="dash-header">
                <div class="titulo-painel">Painel de Controle</div>
                <div id="clock-admin">00:00:00</div>
            </div>
            <div class="grid-horarios" id="grid-admin"></div>
        </div>
    </div>
</div>

<!-- TELA DE VISUALIZAÇÃO (OTIMIZADA PARA PC) -->
<div id="view-display" class="view view-display">
    <div class="main-content">
        <div class="container" style="justify-content: center; align-items: center; max-width: 800px;">
            <div class="dash-header" style="width: 100%; margin-bottom: 30px; border-bottom: 2px solid #1f293a; padding-bottom: 10px;">
                <div class="titulo-painel" style="font-size: 1.2em;">Escala de Café</div>
                <div id="clock-display" style="font-size: 2.5em;">00:00:00</div>
            </div>

            <div class="status-card" id="card-principal" style="width: 100%; min-height: 400px; padding: 30px; flex-direction: column; text-align: center; gap: 20px; overflow: visible; height: auto;">
                <div class="tempo-container" id="tempo-visual" style="width: 120px; height: 120px;">
                    <svg class="circulo-svg" viewBox="-15 -15 190 190">
                        <circle class="circulo-fundo" cx="80" cy="80" r="70"></circle>
                        <circle class="circulo-progresso" id="barra-circular" cx="80" cy="80" r="70"></circle>
                    </svg>
                    <div class="mascote-logistica" id="boneco" style="font-size: 50px;">☕</div>
                </div>

                <div class="info-grupo" style="text-align: center; width: 100%;">
                    <div class="label-status" style="font-size: 1em; letter-spacing: 2px;">Esquadrão em Pausa Ativa:</div>
                    <div id="grupo-nome" class="nomes-ativos" style="font-size: 2.2em; color: #00f2fe; margin: 15px 0; word-wrap: break-word; line-height: 1.2; display: block;">AGUARDANDO...</div>
                    <div id="aviso-saida" class="aviso-saida" style="font-size: 1.5em; color: #ff3333;">⚠️ RETORNAR À OPERAÇÃO ⚠️</div>
                </div>
            </div>
            
            <div id="grid-display" style="display: none;"></div>
        </div>
    </div>
</div>

<audio id="somAlarme" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>

<script>
    // CONFIGURAÇÃO FIREBASE (Mantida do original)
    const firebaseConfig = {
        apiKey: "AIzaSyAP_R6alrWpn-4KosHhGAxmCaslUnsstms",
        authDomain: "cafe-79569.firebaseapp.com",
        projectId: "cafe-79569",
        storageBucket: "cafe-79569.firebasestorage.app",
        messagingSenderId: "265641085934",
        appId: "1:265641085934:web:d4e24af689cc57d5a69cff"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const horariosFixos = ["02:00", "02:10", "02:20", "02:30", "02:40", "02:50", "03:00", "03:10", "03:20", "03:30"];
    let dadosEscala = {}; 
    let listaFuncionarios = [];
    let audioDesbloqueado = false;

    // INICIALIZAÇÃO
    window.onload = function() {
        gerarGrids();
        carregarDados();
        setInterval(atualizarRelogioELogica, 1000);
        
        document.body.addEventListener('click', () => {
            if (!audioDesbloqueado) {
                const som = document.getElementById('somAlarme');
                som.volume = 0; som.play().then(() => { som.pause(); som.currentTime = 0; som.volume = 1; audioDesbloqueado = true; });
            }
        });
    };

    function switchView(view) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        event.target.classList.add('active');
        
        if(view === 'display') {
            document.getElementById('nav-bar').style.opacity = "0.1";
            document.getElementById('nav-bar').addEventListener('mouseenter', () => document.getElementById('nav-bar').style.opacity = "1");
            document.getElementById('nav-bar').addEventListener('mouseleave', () => document.getElementById('nav-bar').style.opacity = "0.1");
        } else {
            document.getElementById('nav-bar').style.opacity = "1";
        }
    }

    // FIREBASE SYNC
    function carregarDados() {
        // Escala
        db.collection("logistica").doc("escalaDeHoje").onSnapshot((doc) => {
            dadosEscala = doc.exists ? doc.data() : {};
            horariosFixos.forEach(h => { 
                if(!dadosEscala[h]) dadosEscala[h] = []; 
                renderizarSlot(h); 
            });
        });
        // Lista Lateral
        db.collection("logistica").doc("listaLateral").onSnapshot((doc) => {
            if (doc.exists) {
                listaFuncionarios = doc.data().nomes || [];
                renderizarPool();
            }
        });
    }

    function salvarEscala() { db.collection("logistica").doc("escalaDeHoje").set(dadosEscala); }
    function salvarPool() { db.collection("logistica").doc("listaLateral").set({ nomes: listaFuncionarios }); }

    // GESTÃO DE NOMES
    function adicionarNomeManual() {
        const input = document.getElementById('novoNome');
        const nome = input.value.trim().toUpperCase();
        if (nome) {
            if (!listaFuncionarios.includes(nome)) {
                listaFuncionarios.push(nome);
                salvarPool();
            }
            input.value = "";
        }
    }

    function limparTodosNomes() {
        if(confirm("Deseja apagar todos os nomes da lista lateral?")) {
            listaFuncionarios = [];
            salvarPool();
        }
    }

    function removerNome(nome) {
        listaFuncionarios = listaFuncionarios.filter(n => n !== nome);
        salvarPool();
    }

    function renderizarPool() {
        const pool = document.getElementById('lista-disponiveis');
        pool.innerHTML = '';
        // Filtrar nomes que já estão na escala para não repetir no pool (opcional, mas limpo)
        const nomesNaEscala = Object.values(dadosEscala).flat();
        const disponiveis = listaFuncionarios.filter(n => !nomesNaEscala.includes(n));

        disponiveis.forEach(nome => {
            const div = document.createElement('div');
            div.className = 'funcionario-item';
            div.draggable = true;
            div.innerHTML = `<span>${nome}</span> <button class="btn-delete-small" onclick="removerNome('${nome}')">×</button>`;
            div.ondragstart = (ev) => {
                ev.dataTransfer.setData("nome", nome);
                ev.dataTransfer.setData("origem", "pool");
            };
            pool.appendChild(div);
        });
    }

    function importarExcel(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
            
            rows.forEach(linha => {
                if(linha[0]) {
                    const nome = String(linha[0]).trim().toUpperCase();
                    if(nome && !listaFuncionarios.includes(nome)) {
                        listaFuncionarios.push(nome);
                    }
                }
            });
            salvarPool();
            event.target.value = '';
        };
        reader.readAsArrayBuffer(event.target.files[0]);
    }

    // DRAG AND DROP
    function gerarGrids() {
        const gridAdmin = document.getElementById('grid-admin');
        const gridDisplay = document.getElementById('grid-display');
        gridAdmin.innerHTML = '';
        gridDisplay.innerHTML = '';

        horariosFixos.forEach(h => {
            gridAdmin.innerHTML += `
                <div class="slot-horario" id="admin-box-${h}" ondrop="dropNoHorario(event, '${h}')" ondragover="allowDrop(event)">
                    <div class="slot-header">🕒 ${h}</div>
                    <div class="slot-nomes" id="admin-slot-${h}"></div>
                </div>`;
            gridDisplay.innerHTML += `
                <div class="slot-horario" id="display-box-${h}">
                    <div class="slot-header">🕒 ${h}</div>
                    <div class="slot-nomes" id="display-slot-${h}"></div>
                </div>`;
        });
    }

    function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }

    function dropNoHorario(ev, hora) {
        ev.preventDefault();
        ev.currentTarget.classList.remove('drag-over');
        const nome = ev.dataTransfer.getData("nome");
        const origem = ev.dataTransfer.getData("origem"); // 'pool' ou uma hora específica

        // Se veio de outro horário, remove de lá
        if (origem !== "pool") {
            dadosEscala[origem] = dadosEscala[origem].filter(n => n !== nome);
        }

        // Adiciona no novo horário se não for duplicado no mesmo slot
        if (!dadosEscala[hora].includes(nome)) {
            dadosEscala[hora].push(nome);
        }
        
        salvarEscala();
    }

    function dropNoPool(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.remove('drag-over');
        const nome = ev.dataTransfer.getData("nome");
        const origem = ev.dataTransfer.getData("origem");

        if (origem !== "pool") {
            dadosEscala[origem] = dadosEscala[origem].filter(n => n !== nome);
            salvarEscala();
        }
    }

    function removerDaEscala(hora, nome) {
        dadosEscala[hora] = dadosEscala[hora].filter(n => n !== nome);
        salvarEscala();
    }

    function renderizarSlot(h) {
        const slots = [document.getElementById(`admin-slot-${h}`), document.getElementById(`display-slot-${h}`)];
        const nomes = dadosEscala[h] || [];
        
        slots.forEach((container, idx) => {
            if(!container) return;
            container.innerHTML = nomes.map(n => `
                <span class="nome-tag" draggable="${idx === 0}" ondragstart="startDragFromSlot(event, '${h}', '${n}')">
                    ${n} ${idx === 0 ? `<button class="btn-remove-tag" onclick="removerDaEscala('${h}', '${n}')">×</button>` : ''}
                </span>
            `).join('');
        });
        renderizarPool(); // Atualiza pool para esconder quem entrou na escala
    }

    function startDragFromSlot(ev, hora, nome) {
        ev.dataTransfer.setData("nome", nome);
        ev.dataTransfer.setData("origem", hora);
    }

    // LÓGICA DE TEMPO E ALERTAS
    function atualizarRelogioELogica() {
        const agora = new Date();
        const horaTexto = agora.toLocaleTimeString();
        document.getElementById('clock-admin').innerText = horaTexto;
        document.getElementById('clock-display').innerText = horaTexto;

        const agoraMins = agora.getHours() * 60 + agora.getMinutes();
        let alguemNoCafe = false;

        const visual = document.getElementById('tempo-visual');
        const barraCircular = document.getElementById('barra-circular');
        const boneco = document.getElementById('boneco');
        const aviso = document.getElementById('aviso-saida');
        const grupoNome = document.getElementById('grupo-nome');

        horariosFixos.forEach((h) => {
            const [hora, min] = h.split(':').map(Number);
            const inicio = hora * 60 + min;
            const fim = inicio + 10;
            
            const boxAdmin = document.getElementById(`admin-box-${h}`);
            const boxDisplay = document.getElementById(`display-box-${h}`);

            if (agoraMins >= inicio && agoraMins < fim) {
                alguemNoCafe = true;
                if(boxAdmin) boxAdmin.classList.add('active-row');
                if(boxDisplay) boxDisplay.classList.add('active-row');
                
                const nomes = (dadosEscala[h] && dadosEscala[h].length > 0) ? dadosEscala[h].join(', ') : "EQUIPE NÃO DEFINIDA";
                grupoNome.innerText = nomes;

                let segsPassados = ((agoraMins - inicio) * 60) + agora.getSeconds();
                let porcentagem = segsPassados / 600; 
                let offset = 440 - (porcentagem * 440); 
                barraCircular.style.strokeDashoffset = offset;

                if (agoraMins === fim - 1 && agora.getSeconds() > 30) { 
                    visual.classList.add('tempo-critico');
                    aviso.style.display = "block";
                    boneco.innerText = "🏃‍♂️";
                    if (agora.getSeconds() % 10 === 0) document.getElementById('somAlarme').play();
                } else {
                    visual.classList.remove('tempo-critico');
                    aviso.style.display = "none";
                    boneco.innerText = "☕";
                }
            } else {
                if(boxAdmin) boxAdmin.classList.remove('active-row');
                if(boxDisplay) boxDisplay.classList.remove('active-row');
            }
        });

        if (!alguemNoCafe) {
            grupoNome.innerText = "NENHUMA EQUIPE NO CAFÉ";
            boneco.innerText = "📦"; 
            aviso.style.display = "none"; 
            visual.classList.remove('tempo-critico');
            barraCircular.style.strokeDashoffset = 440; 
        }
    }
</script>
